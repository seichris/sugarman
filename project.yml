name: Sugarman
configFiles:
  Debug: Config/DevelopmentTeam.xcconfig
  Release: Config/DevelopmentTeam.xcconfig
options:
  bundleIdPrefix: app.sugarman
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SELECTED_FILES: empty
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
packages:
  Sugarman:
    path: .
targets:
  Sugarman:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Sugarman
        excludes:
          - Info.plist
    resources:
      - path: Apps/Sugarman/Localizable.xcstrings
    info:
      path: Apps/Sugarman/Info.plist
      properties:
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: Sugarman uses Bluetooth to connect to an owned glucose sensor you have already set up. It does not send sensor commands until hardware evidence gates pass.
        NSBluetoothPeripheralUsageDescription: Sugarman uses Bluetooth to connect to an owned glucose sensor you have already set up.
        NFCReaderUsageDescription: Sugarman can read an owned sensor package or tag to identify the sensor. Scanning does not activate or bind the sensor.
        com.apple.developer.nfc.readersession.formats:
          - NDEF
        NSCameraUsageDescription: Sugarman can scan a package Data Matrix to identify an owned sensor. Scanning does not send sensor commands.
        NSHealthShareUsageDescription: Sugarman can read workouts you choose to share so you can overlay them with glucose. HealthKit glucose writes are disabled until validation gates pass.
        NSHealthUpdateUsageDescription: Sugarman may later write validated glucose to Apple Health. HealthKit glucose writes are disabled in this build.
    entitlements:
      path: Apps/Sugarman/Sugarman.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - NDEF
        com.apple.security.application-groups:
          - group.app.sugarman.sensor-owner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sugarman.ios
        PRODUCT_NAME: Sugarman
        INFOPLIST_FILE: Apps/Sugarman/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Apps/Sugarman/Sugarman.entitlements
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    dependencies:
      - package: Sugarman
        product: SugarmanDomain
      - package: Sugarman
        product: GS3Protocol
      - package: Sugarman
        product: GS3Transport
      - package: Sugarman
        product: SensorOnboarding
      - package: Sugarman
        product: AccountBinding
      - package: Sugarman
        product: SugarmanStore
      - package: Sugarman
        product: SafetyEngine
      - package: Sugarman
        product: Integrations
      - package: Sugarman
        product: SugarmanDiagnostics
      - package: Sugarman
        product: SensorOwnership
    scheme:
      testTargets: []
  SugarmanDeviceTest:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/Sugarman
        excludes:
          - Info.plist
          - Sugarman.entitlements
    resources:
      - path: Apps/Sugarman/Localizable.xcstrings
    info:
      path: Apps/SugarmanDeviceTest/Info.plist
      properties:
        CFBundleDisplayName: Sugarman Device Test
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - bluetooth-central
        LSSupportsOpeningDocumentsInPlace: true
        NSBluetoothAlwaysUsageDescription: Sugarman Device Test runs an explicitly armed managed foreground connection to one owned, already-active glucose sensor.
        NSBluetoothPeripheralUsageDescription: Sugarman Device Test runs an explicitly armed managed foreground connection to one owned, already-active glucose sensor.
        NFCReaderUsageDescription: Sugarman Device Test can read an owned sensor tag to store a redacted identity. Scanning does not activate or bind the sensor.
        com.apple.developer.nfc.readersession.formats:
          - NDEF
        NSCameraUsageDescription: Sugarman Device Test can scan a package Data Matrix to store a redacted identity. Scanning does not send sensor commands.
        NSHealthShareUsageDescription: Sugarman Device Test can read workouts you choose to share. HealthKit glucose writes remain disabled.
        NSHealthUpdateUsageDescription: HealthKit glucose writes are disabled in Sugarman Device Test.
    entitlements:
      path: Apps/SugarmanDeviceTest/SugarmanDeviceTest.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - NDEF
        com.apple.security.application-groups:
          - group.app.sugarman.sensor-owner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sugarman.ios.devicetest
        PRODUCT_NAME: Sugarman Device Test
        INFOPLIST_FILE: Apps/SugarmanDeviceTest/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Apps/SugarmanDeviceTest/SugarmanDeviceTest.entitlements
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SUGARMAN_DEVICE_TEST
    dependencies:
      - package: Sugarman
        product: SugarmanDomain
      - package: Sugarman
        product: GS3Protocol
      - package: Sugarman
        product: GS3Transport
      - package: Sugarman
        product: GS3DeviceProvisioning
      - package: Sugarman
        product: PrivateDocumentImport
      - package: Sugarman
        product: SensorOnboarding
      - package: Sugarman
        product: AccountBinding
      - package: Sugarman
        product: SugarmanStore
      - package: Sugarman
        product: SafetyEngine
      - package: Sugarman
        product: Integrations
      - package: Sugarman
        product: SugarmanDiagnostics
      - package: Sugarman
        product: SensorOwnership
    scheme:
      testTargets: []
  SugarmanProbe:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Apps/SugarmanProbe
        excludes:
          - Info.plist
    info:
      path: Apps/SugarmanProbe/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: Sugarman Probe performs one explicitly confirmed developer handover attempt with an owned, already-active GS3 sensor.
        NSBluetoothPeripheralUsageDescription: Sugarman Probe performs one explicitly confirmed developer handover attempt with an owned, already-active GS3 sensor.
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: Apps/SugarmanProbe/SugarmanProbe.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.sugarman.sensor-owner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sugarman.probe
        PRODUCT_NAME: Sugarman Probe
        INFOPLIST_FILE: Apps/SugarmanProbe/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: Sugarman
        product: GS3DeveloperProbe
      - package: Sugarman
        product: GS3Protocol
      - package: Sugarman
        product: PrivateDocumentImport
      - package: Sugarman
        product: SensorOwnership
    scheme:
      testTargets: []
